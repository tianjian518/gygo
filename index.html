<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gygo · 光鸭分享追更</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--dim:#8b93a7;
        --ok:#3ecf8e;--err:#ff6b6b;--warn:#ffb454;--acc:#5b8cff}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  input,textarea{width:100%;background:#0d0f14;border:1px solid var(--line);
    color:var(--fg);border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit}
  textarea{min-height:78px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  button{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:9px 16px;
    font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button.ghost:hover{color:var(--fg);border-color:var(--dim)}
  .banner{background:#3a1d1d;border:1px solid var(--err);color:#ffbcbc;
    padding:11px 14px;border-radius:8px;margin-bottom:16px;display:none}
  .banner.show{display:block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:8px 10px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px;border-bottom:1px solid #1e222b;vertical-align:top}
  td.path{color:var(--dim);font-size:12px;word-break:break-all;max-width:280px}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;white-space:nowrap}
  .t-ok{background:rgba(62,207,142,.14);color:var(--ok)}
  .t-error{background:rgba(255,107,107,.14);color:var(--err)}
  .t-invalid{background:rgba(255,107,107,.22);color:var(--err)}
  .t-paused{background:rgba(255,180,84,.14);color:var(--warn)}
  .t-pending{background:rgba(139,147,167,.14);color:var(--dim)}
  .msg{margin-top:12px;font-size:13px;display:none;padding:9px 12px;border-radius:7px}
  .msg.ok{display:block;background:rgba(62,207,142,.1);color:var(--ok)}
  .msg.err{display:block;background:rgba(255,107,107,.1);color:var(--err)}
  .empty{color:var(--dim);text-align:center;padding:26px;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{padding:5px 10px;font-size:12px}
</style>
</head>
<body>
<h1>gygo · 光鸭分享追更</h1>
<div class="sub">粘贴光鸭分享链接 → 每小时自动检查 → 出新集就自动转存到你的光鸭云盘</div>

<div class="banner" id="expireBanner">
  登录已失效，请重新登录。重新登录后监控会自动恢复。
</div>

<!-- 登录 -->
<div class="card">
  <h2>🔐 登录光鸭云盘</h2>
  <div id="loginBox">
    <div class="row">
      <div><label>手机号</label><input id="phone" placeholder="13800138000" autocomplete="off"></div>
      <div style="flex:0 0 auto"><button id="btnSend">发送验证码</button></div>
    </div>
    <div class="row">
      <div><label>短信验证码</label><input id="code" placeholder="6 位数字" autocomplete="off"></div>
      <div style="flex:0 0 auto"><button id="btnLogin">登录</button></div>
    </div>
  </div>
  <div id="loggedBox" style="display:none">
    <div style="color:var(--ok);margin-bottom:10px">已登录：<b id="who"></b></div>
    <button class="ghost" id="btnLogout">退出登录</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- 添加监控 -->
<div class="card">
  <h2>➕ 添加追更监控</h2>
  <label>光鸭分享链接（可整段粘贴，提取码会自动识别）</label>
  <textarea id="shareUrl" placeholder="https://www.guangyapan.com/s/xxxxxx 提取码：abcd"></textarea>
  <div class="row">
    <div><label>转存到我的目录（留空=根目录）</label>
      <input id="targetPath" placeholder="影视/美剧/某某剧"></div>
    <div style="flex:0 0 150px"><label>扫描间隔（分钟）</label>
      <input id="interval" type="number" value="60" min="60"></div>
  </div>
  <div class="hint">间隔最低 60 分钟。调太低会触发光鸭风控，得不偿失。</div>
  <div style="margin-top:14px"><button id="btnAdd">＋ 添加监控</button></div>
  <div class="msg" id="addMsg"></div>
</div>

<!-- 列表 -->
<div class="card">
  <h2>📡 监控列表 <span style="color:var(--dim);font-weight:400;font-size:12px">（每 30 秒自动刷新）</span></h2>
  <div id="listWrap"><div class="empty">还没有监控项</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
function show(el, msg, ok){
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
  setTimeout(()=>{ el.className='msg'; }, ok?5000:9000);
}
async function api(url, opt){
  const r = await fetch(url, opt || {});
  return await r.json();
}

// ---------- 登录 ----------
$('btnSend').onclick = async () => {
  const phone = $('phone').value.trim();
  if(!phone) return show($('loginMsg'), '请填写手机号', false);
  $('btnSend').disabled = true; $('btnSend').textContent = '发送中…';
  const r = await api('/api/sms/send', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone})});
  $('btnSend').disabled = false; $('btnSend').textContent = '发送验证码';
  show($('loginMsg'), r.msg || '已发送', r.ok);
};
$('btnLogin').onclick = async () => {
  const phone = $('phone').value.trim(), code = $('code').value.trim();
  if(!phone || !code) return show($('loginMsg'), '手机号和验证码都要填', false);
  $('btnLogin').disabled = true;
  const r = await api('/api/sms/login', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone, code})});
  $('btnLogin').disabled = false;
  show($('loginMsg'), r.msg || '', r.ok);
  if(r.ok){ $('code').value=''; refresh(); }
};
$('btnLogout').onclick = async () => {
  await api('/api/logout', {method:'POST'});
  refresh();
};

// ---------- 添加 ----------
$('btnAdd').onclick = async () => {
  const share_url = $('shareUrl').value.trim();
  if(!share_url) return show($('addMsg'), '请粘贴分享链接', false);
  $('btnAdd').disabled = true; $('btnAdd').textContent = '添加中…';
  const r = await api('/api/monitors', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({share_url,
      target_path: $('targetPath').value.trim(),
      interval_min: parseInt($('interval').value || '60', 10)})});
  $('btnAdd').disabled = false; $('btnAdd').textContent = '＋ 添加监控';
  show($('addMsg'), r.msg || (r.ok ? '已添加，基线已建立' : '添加失败'), r.ok);
  if(r.ok){ $('shareUrl').value=''; refresh(); }
};

// ---------- 列表 ----------
async function refresh(){
  const s = await api('/api/status');
  const logged = s.logged;
  $('loginBox').style.display = logged ? 'none' : 'block';
  $('loggedBox').style.display = logged ? 'block' : 'none';
  $('expireBanner').className = 'banner' + (s.expired ? ' show' : '');
  if(logged) $('who').textContent = s.phone || '已登录';

  const d = await api('/api/monitors');
  const items = d.monitors || [];
  if(!items.length){
    $('listWrap').innerHTML = '<div class="empty">还没有监控项</div>';
    return;
  }
  let html = '<table><tr><th>分享</th><th>转存到</th><th>状态</th><th>上次扫描</th><th>最近结果</th><th>操作</th></tr>';
  for(const m of items){
    const tag = 't-' + (m.status || 'pending');
    const label = {ok:'正常', error:'出错', invalid:'链接失效', paused:'已暂停', pending:'待扫描'}[m.status] || m.status;
    html += `<tr>
      <td>${m.link_name ? esc(m.link_name) + '<br>' : ''}<span style="color:var(--dim);font-size:12px">${esc((m.share_url||'').slice(0,42))}${(m.share_url||'').length>42?'…':''}</span></td>
      <td class="path">${esc(m.target_path || '/（根目录）')}</td>
      <td><span class="tag ${tag}">${label}</span>${m.enabled?'':' <span class="tag t-pending">已停用</span>'}</td>
      <td style="white-space:nowrap;color:var(--dim)">${esc(m.last_scan || '—')}<br><span style="font-size:12px">每 ${m.interval_min} 分钟</span></td>
      <td class="path">${esc(m.last_result || '—')}</td>
      <td><div class="acts">
        <button class="ghost" onclick="scanNow(${m.id}, this)">立即扫描</button>
        <button class="ghost" onclick="toggle(${m.id})">${m.enabled?'停用':'启用'}</button>
        <button class="ghost" onclick="del(${m.id})">删除</button>
      </div></td></tr>`;
  }
  $('listWrap').innerHTML = html + '</table>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function scanNow(id, btn){
  btn.disabled = true; btn.textContent = '扫描中…';
  const r = await api('/api/monitors/' + id + '/scan', {method:'POST'});
  btn.disabled = false; btn.textContent = '立即扫描';
  alert(r.ok ? ('扫描完成：' + (r.result && r.result.msg || JSON.stringify(r.result)))
             : ('失败：' + (r.msg || '未知错误')));
  refresh();
}
async function toggle(id){ await api('/api/monitors/' + id + '/toggle', {method:'POST'}); refresh(); }
async function del(id){ if(confirm('确定删除这个监控项？')){ await api('/api/monitors/' + id, {method:'DELETE'}); refresh(); } }

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
